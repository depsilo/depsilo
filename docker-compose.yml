version: '3.8'
services:
  depsilo:
    build: .
    ports:
      - "23333:23333"
    volumes:
      - ./data:/app/data
      - ./config.toml:/app/config.toml
    environment:
      - DEPSILO_CONFIG=/app/config.toml
      - DEPSILO_AUTH_JWT_SECRET=${DEPSILO_AUTH_JWT_SECRET:?set a random DEPSILO_AUTH_JWT_SECRET}
      - DEPSILO_ADMIN_USERNAME=${DEPSILO_ADMIN_USERNAME:-admin}
      - DEPSILO_ADMIN_PASSWORD=${DEPSILO_ADMIN_PASSWORD:?set a strong DEPSILO_ADMIN_PASSWORD}
    restart: unless-stopped
