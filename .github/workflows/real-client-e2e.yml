name: Real client E2E

on:
  schedule:
    # Weekly: these tests download from 14 live package ecosystems and are
    # intentionally outside the ordinary push/pull_request path.
    - cron: '17 19 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: real-client-e2e
  cancel-in-progress: false

jobs:
  real-clients:
    name: All 14 ecosystems
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run real package-manager clients
        run: make test-e2e

      - name: Upload server log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: real-client-server-log
          path: .dev.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Clean up
        if: always()
        run: make stop test-clean
