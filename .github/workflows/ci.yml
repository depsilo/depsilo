name: CI

# Runs on every push and PR to the default branch. The repo's default
# branch is `master` — the previous `main` filter meant CI never fired
# on ordinary pushes (v0.8.0 blind spot). Tag publishing lives in the
# separately gated release workflow; this workflow is verification only.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
