name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  # Job 1: Server binaries (6 platforms) via GoReleaser
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        working-directory: web
        run: npm ci && npm run build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Job 2: Desktop — macOS (universal binary)
  desktop-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build desktop app
        run: wails build -platform darwin/universal -o depsilo-desktop

      - name: Package .app into zip
        run: |
          cd build/bin
          if [ -d "depsilo-desktop.app" ]; then
            zip -r depsilo-desktop-macos-universal.zip depsilo-desktop.app
          else
            zip depsilo-desktop-macos-universal.zip depsilo-desktop
          fi

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: build/bin/depsilo-desktop-macos-universal.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Job 3: Desktop — Windows (amd64)
  desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build desktop app with NSIS installer
        run: wails build -nsis -o depsilo-desktop

      - name: Find and rename installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path build/bin -Filter "*-amd64-installer.exe" -Recurse | Select-Object -First 1
          if ($installer) {
            Copy-Item $installer.FullName "build/bin/depsilo-desktop-windows-amd64-installer.exe"
          } else {
            # Fallback: zip the exe
            Compress-Archive -Path "build/bin/depsilo-desktop.exe" -DestinationPath "build/bin/depsilo-desktop-windows-amd64.zip"
          }

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/bin/depsilo-desktop-windows-amd64-installer.exe
            build/bin/depsilo-desktop-windows-amd64.zip
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Job 4: Desktop — Linux (amd64)
  desktop-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build desktop app
        run: wails build -o depsilo-desktop

      - name: Create .desktop file
        run: |
          cat > build/bin/depsilo-desktop.desktop << 'DESKTOP'
          [Desktop Entry]
          Name=Depsilo
          Comment=Lightweight dependency cache
          Exec=depsilo-desktop
          Icon=depsilo
          Type=Application
          Categories=Development;
          DESKTOP

      - name: Package into tar.gz
        run: |
          cd build/bin
          tar czf depsilo-desktop-linux-amd64.tar.gz depsilo-desktop depsilo-desktop.desktop

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: build/bin/depsilo-desktop-linux-amd64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
