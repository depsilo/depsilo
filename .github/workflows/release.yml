name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  # Job 1: Cross-platform CLI binaries via GoReleaser (6 platforms)
  # Also generates Homebrew formula + checksums + changelog
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        working-directory: web
        run: npm ci && npm run build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # For Homebrew tap push
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      - name: Upload install.sh to release
        uses: softprops/action-gh-release@v2
        with:
          files: install.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── SBOM: source-tree dependency manifest ─────────────────────
      # Generates a CycloneDX + SPDX SBOM covering BOTH the Go modules
      # (go.mod / go.sum) and the frontend npm deps (web/package-lock.json)
      # by pointing Syft at the repo root after the frontend has been built.
      # Captures *intended* dependencies — for the actually-deployed
      # runtime image, see the image-level SBOM in docker-publish.yml.
      #
      # SBOMs are currently released as unsigned artifacts; cosign-attest
      # layers on top once T0 #2 (signed releases) lands. See
      # docs/adr/0003-supply-chain-control-point.md.
      - name: Generate source SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: depsilo-${{ github.ref_name }}-source.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate source SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: depsilo-${{ github.ref_name }}-source.spdx.json
          upload-artifact: false
          upload-release-assets: false

      # sbom-action's upload-release-assets only fires on `release`
      # events — on tag pushes it silently skips (v0.8.0 postmortem:
      # green run, no assets). GoReleaser created the release earlier
      # in this job, so a plain explicit upload works here.
      - name: Upload source SBOMs to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            "depsilo-${{ github.ref_name }}-source.cdx.json" \
            "depsilo-${{ github.ref_name }}-source.spdx.json" \
            --clobber -R "${{ github.repository }}"

  # Job 2: macOS menu-bar app (.app bundle, unsigned)
  # Built on macOS via `make app-macos` which wraps `cmd/depsilo-tray` in
  # a proper bundle with Info.plist + .icns. Unsigned — users must
  # right-click → Open on first launch (Gatekeeper).
  tray-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install rsvg-convert (SVG -> PNG for icon)
        run: brew install librsvg

      - name: Install frontend deps
        working-directory: web
        run: npm ci

      - name: Build .app bundle
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          make app-macos VERSION="${VERSION}"

      - name: Zip Depsilo.app
        run: |
          cd bin
          zip -r "depsilo-tray-macos.zip" Depsilo.app

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: bin/depsilo-tray-macos.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Job 3: Linux menu-bar app (tar.gz with tray binary + .desktop launcher)
  # Built on Ubuntu LTS. Users untar + `bash install-linux.sh install`
  # to drop the binary into ~/.local/bin and register the .desktop file.
  # Needs GTK + AppIndicator headers at build time for fyne/systray.
  tray-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux tray build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install frontend deps
        working-directory: web
        run: npm ci

      - name: Build tray binary
        run: make tray

      - name: Package tar.gz
        run: |
          mkdir -p stage
          cp bin/depsilo-tray stage/
          cp assets/linux/depsilo-tray.desktop stage/
          cp scripts/install-linux.sh stage/
          chmod +x stage/install-linux.sh
          tar czf depsilo-tray-linux-amd64.tar.gz -C stage .

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: depsilo-tray-linux-amd64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
