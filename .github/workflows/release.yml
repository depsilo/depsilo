name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  queue: max
  cancel-in-progress: false

jobs:
  release-tag:
    name: Release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Validate SemVer tag
        shell: bash
        run: bash scripts/validate-release-tag.sh "$GITHUB_REF_NAME"

  verify:
    needs: release-tag
    uses: ./.github/workflows/verify.yml

  client-contracts:
    needs: [release-tag, verify]
    uses: ./.github/workflows/real-client-e2e.yml
    with:
      release_qualification: true

  # Job 1: Cross-platform CLI binaries via GoReleaser (6 platforms), plus
  # checksums, changelog, tray bundles, and source SBOMs.
  release:
    needs: [verify, client-contracts, tray-macos, tray-linux]
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # Generate the source inventory before npm ci/frontend/GoReleaser create
      # node_modules or build artifacts, so Syft sees only declared sources.
      - name: Generate source SBOM (CycloneDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: ${{ runner.temp }}/depsilo-${{ github.ref_name }}-source.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate source SBOM (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: ${{ runner.temp }}/depsilo-${{ github.ref_name }}-source.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.2'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        working-directory: web
        run: npm ci && npm run build

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2

      # GoReleaser uploads CLI archives, checksums, and install.sh to a draft.
      # A failed/retried job reuses that draft and replaces duplicate assets.
      - name: Extract release notes
        shell: bash
        run: bash scripts/extract-release-notes.sh "$GITHUB_REF_NAME" >"$RUNNER_TEMP/release-notes.md"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.15.4
          args: release --clean --release-notes ${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke-test Linux archive
        shell: bash
        run: |
          set -euo pipefail
          archive="$(find dist -type f -name 'depsilo_*_linux_amd64.tar.gz' -print -quit)"
          test -n "$archive"
          smoke_dir="$(mktemp -d)"
          tar -xzf "$archive" -C "$smoke_dir"
          test -x "$smoke_dir/depsilo"
          "$smoke_dir/depsilo" version
          (cd dist && sha256sum --check checksums.txt)

      # GoReleaser validates that the checkout is clean. Keep release-assets
      # outside the worktree until that validation and the archive smoke pass.
      - name: Stage source SBOMs
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p release-assets/source
          cp "$RUNNER_TEMP/depsilo-${RELEASE_TAG}-source.cdx.json" release-assets/source/
          cp "$RUNNER_TEMP/depsilo-${RELEASE_TAG}-source.spdx.json" release-assets/source/

      - name: Download tray bundles
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: depsilo-tray-*
          path: release-assets/tray
          merge-multiple: true

      - name: Sign release checksums and attached artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets/signatures
          for artifact in \
            dist/checksums.txt \
            install.sh \
            release-assets/source/* \
            release-assets/tray/*; do
            test -f "$artifact"
            bundle="release-assets/signatures/$(basename "$artifact").sigstore.json"
            cosign sign-blob --yes --bundle "$bundle" "$artifact"
          done

      # Keep the release as a draft until the container is smoke-tested,
      # signed, and attested. Users never see a partially trusted release.
      - name: Upload signed release assets to draft
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          draft: true
          files: |
            release-assets/tray/*
            release-assets/source/*
            release-assets/signatures/*
          fail_on_unmatched_files: true

  # Job 2: macOS menu-bar app (.app bundle, unsigned)
  # Built on macOS via `make app-macos` which wraps `cmd/depsilo-tray` in
  # a proper bundle with Info.plist + .icns. Unsigned — users must
  # right-click → Open on first launch (Gatekeeper).
  tray-macos:
    needs: verify
    permissions:
      contents: read
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.2'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      # The launcher process exits before a fresh CLI process requests stop,
      # proving the Setsid-based daemon survives its originating terminal.
      - name: Test detached macOS daemon lifecycle
        run: >-
          go test ./internal/cli
          -run '^(TestDaemonUsesServePortAndWritesPrivateStartupLog|TestDaemonStartsInNewSession)$'
          -count=1 -timeout=4m

      - name: Install rsvg-convert (SVG -> PNG for icon)
        run: brew install librsvg

      - name: Install frontend deps
        working-directory: web
        run: npm ci

      - name: Build .app bundle
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          make app-macos VERSION="${VERSION}"

      - name: Zip Depsilo.app
        run: |
          cd bin
          zip -r "depsilo-tray-macos.zip" Depsilo.app

      - name: Stage tray artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: depsilo-tray-macos
          path: bin/depsilo-tray-macos.zip
          if-no-files-found: error
          retention-days: 7

  # Job 3: Linux menu-bar app (tar.gz with tray binary + .desktop launcher)
  # Built on Ubuntu LTS. Users untar + `bash install-linux.sh install`
  # to drop the binary into ~/.local/bin and register the .desktop file.
  # Needs GTK + AppIndicator headers at build time for fyne/systray.
  tray-linux:
    needs: verify
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Linux tray build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.2'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Install frontend deps
        working-directory: web
        run: npm ci

      - name: Build tray binary
        run: make tray

      - name: Package tar.gz
        run: |
          mkdir -p stage
          cp bin/depsilo-tray stage/
          cp assets/linux/depsilo-tray.desktop stage/
          cp scripts/install-linux.sh stage/
          chmod +x stage/install-linux.sh
          tar czf depsilo-tray-linux-amd64.tar.gz -C stage .

      - name: Stage tray artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: depsilo-tray-linux
          path: depsilo-tray-linux-amd64.tar.gz
          if-no-files-found: error
          retention-days: 7

  # Build a uniquely named candidate only after the draft release and all source
  # artifacts exist. This job never writes a public semver or floating tag.
  # Its digest becomes a job output only after smoke, signing, attestation, and
  # release-asset upload have all succeeded.
  container_candidate:
    needs: release
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
      packages: write
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract build metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: |
            depsilo/depsilo
            ghcr.io/depsilo/depsilo
          tags: |
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.title=Depsilo
            org.opencontainers.image.description=Supply-chain enforcement proxy for 14 ecosystems and Docker OCI
            org.opencontainers.image.url=https://depsilo.com
            org.opencontainers.image.source=https://github.com/depsilo/depsilo
            org.opencontainers.image.licenses=MIT

      - name: Build date
        id: date
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push candidate manifests
        id: build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # run_id + run_attempt is unique across a workflow and all of its
          # retries. Candidate tags are never reused or treated as releases.
          tags: |
            depsilo/depsilo:release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
            ghcr.io/depsilo/depsilo:release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.date.outputs.date }}

      - name: Verify candidate digest in both registries
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          CANDIDATE_TAG: release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          for image in depsilo/depsilo ghcr.io/depsilo/depsilo; do
            actual="$(docker buildx imagetools inspect "${image}:${CANDIDATE_TAG}" \
              --format '{{json .Manifest}}' | jq -er '.digest')"
            test "$actual" = "$IMAGE_DIGEST"
          done

      - name: Smoke-test image and readiness endpoint
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          image="ghcr.io/depsilo/depsilo"
          index="$(docker buildx imagetools inspect "${image}@${IMAGE_DIGEST}" --raw)"
          for platform in linux/amd64 linux/arm64; do
            os="${platform%/*}"
            arch="${platform#*/}"
            platform_digest="$(jq -er --arg os "$os" --arg arch "$arch" \
              '[.manifests[] | select(.platform.os == $os and .platform.architecture == $arch)]
               | if length == 1 then .[0].digest else error("expected one platform manifest") end' \
              <<<"$index")"
            [[ "$platform_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            docker run --rm --platform "$platform" \
              "${image}@${platform_digest}" version
          done
          container_id=""
          state_volume="depsilo-release-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          restore_dir=""
          cleanup() {
            if [ -n "$container_id" ]; then
              docker rm -f "$container_id" >/dev/null 2>&1 || true
            fi
            docker volume rm "$state_volume" >/dev/null 2>&1 || true
            if [ -n "$restore_dir" ]; then
              find "$restore_dir" -depth -delete >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT
          docker volume create "$state_volume" >/dev/null
          container_id="$(docker run --detach \
            --publish 127.0.0.1::23333 \
            --volume "$state_volume:/root/.depsilo" \
            "ghcr.io/depsilo/depsilo@${IMAGE_DIGEST}")"
          port="$(docker port "$container_id" 23333/tcp | sed 's/.*://')"
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "http://127.0.0.1:${port}/ready"; then
              ready=true
              break
            fi
            if ! docker inspect --format '{{.State.Running}}' "$container_id" | grep -qx true; then
              docker logs "$container_id"
              exit 1
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            docker logs "$container_id"
            exit 1
          fi
          logs="$(docker logs "$container_id" 2>&1)"
          grep -q 'Portal:' <<<"$logs"
          grep -Eq 'Bootstrap token: [A-Za-z0-9_-]{24,}' <<<"$logs"
          test "$(docker inspect --format '{{.Config.User}}' "$container_id")" = "10001:10001"
          test "$(docker exec "$container_id" id -u)" = "10001"
          test "$(docker exec "$container_id" id -g)" = "10001"
          docker exec "$container_id" sh -c \
            'grep -Eq "^Uid:[[:space:]]+10001([[:space:]]+10001){3}$" /proc/1/status'
          docker exec "$container_id" sh -c \
            'grep -Eq "^Gid:[[:space:]]+10001([[:space:]]+10001){3}$" /proc/1/status'
          docker exec "$container_id" test -f /root/.depsilo/data/depsilo.db
          docker exec "$container_id" test -d /root/.depsilo/data/cache
          test "$(docker exec "$container_id" stat -c '%u:%g' /root/.depsilo)" = "10001:10001"
          test "$(docker exec "$container_id" stat -c '%u:%g' /root/.depsilo/data/depsilo.db)" = "10001:10001"
          docker exec "$container_id" sh -c 'test "$(command -v depsilo)" = /usr/local/bin/depsilo'

          # Reproduce the numeric ownership of a v0.9 root-running named
          # volume, execute the documented one-time migration, then prove the
          # default non-root image can reopen the same SQLite state.
          docker exec "$container_id" sh -c \
            'printf "%s\n" retained > /root/.depsilo/.v090-volume-marker'
          docker rm -f "$container_id" >/dev/null
          container_id=""
          docker run --rm --user 0:0 --entrypoint /bin/chown \
            --volume "$state_volume:/root/.depsilo" \
            "ghcr.io/depsilo/depsilo@${IMAGE_DIGEST}" \
            -R 0:0 /root/.depsilo
          docker run --rm --user 0:0 --entrypoint /bin/chown \
            --volume "$state_volume:/root/.depsilo" \
            "ghcr.io/depsilo/depsilo@${IMAGE_DIGEST}" \
            -R 10001:10001 /root/.depsilo
          container_id="$(docker run --detach \
            --publish 127.0.0.1::23333 \
            --volume "$state_volume:/root/.depsilo" \
            "ghcr.io/depsilo/depsilo@${IMAGE_DIGEST}")"
          port="$(docker port "$container_id" 23333/tcp | sed 's/.*://')"
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "http://127.0.0.1:${port}/ready"; then
              ready=true
              break
            fi
            if ! docker inspect --format '{{.State.Running}}' "$container_id" | grep -qx true; then
              docker logs "$container_id"
              exit 1
            fi
            sleep 2
          done
          test "$ready" = true
          docker exec "$container_id" grep -qx retained /root/.depsilo/.v090-volume-marker
          docker exec "$container_id" test -f /root/.depsilo/data/depsilo.db
          test "$(docker exec "$container_id" stat -c '%u:%g' /root/.depsilo/data/depsilo.db)" = "10001:10001"

          # Complete the real first-run flow so the generated configuration,
          # administrator and SQLite state can be exercised by the documented
          # online backup and isolated restore commands.
          bootstrap_token="$(docker logs "$container_id" 2>&1 \
            | grep -Eo 'Bootstrap token: [A-Za-z0-9_-]{24,}' \
            | tail -1 | awk '{print $3}')"
          [[ "$bootstrap_token" =~ ^[A-Za-z0-9_-]{24,}$ ]]
          setup_payload="$(jq -nc '{
            server: {port: 23333},
            storage: {path: "/root/.depsilo/data/cache"},
            admin: {username: "release-operator", password: "Release&Container-Password-47"},
            ecosystems: {
              npm: {
                enabled: true,
                upstreams: [{name: "npm", url: "https://registry.npmjs.org", priority: 1}]
              }
            }
          }')"
          curl --fail --silent --show-error \
            --header 'Content-Type: application/json' \
            --header "X-Depsilo-Bootstrap-Token: $bootstrap_token" \
            --data "$setup_payload" \
            "http://127.0.0.1:${port}/api/v1/setup/complete" \
            | jq -e '.status == "ok"'
          configured=false
          for attempt in $(seq 1 30); do
            startup_count="$(docker logs "$container_id" 2>&1 | grep -c 'Portal:' || true)"
            if [ "$startup_count" -ge 2 ] \
              && curl --fail --silent "http://127.0.0.1:${port}/ready" >/dev/null \
              && curl --fail --silent "http://127.0.0.1:${port}/api/v1/setup/status" \
                | jq -e '.needs_setup == false' >/dev/null; then
              configured=true
              break
            fi
            if ! docker inspect --format '{{.State.Running}}' "$container_id" | grep -qx true; then
              docker logs "$container_id"
              exit 1
            fi
            sleep 2
          done
          test "$configured" = true

          docker exec "$container_id" depsilo backup \
            --out /tmp/depsilo-release-backup.tar.gz --json \
            | jq -e '.ok == true'
          restore_dir="$(mktemp -d "${RUNNER_TEMP}/depsilo-release-restore.XXXXXX")"
          mkdir -p "$restore_dir/data"
          docker cp "$container_id:/tmp/depsilo-release-backup.tar.gz" \
            "$restore_dir/depsilo-release-backup.tar.gz"
          test "$(tar -tzf "$restore_dir/depsilo-release-backup.tar.gz" \
            | sort | paste -sd, -)" = "config.toml,depsilo.db,manifest.json"
          docker rm -f "$container_id" >/dev/null
          container_id=""

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp/depsilo-home \
            --volume "$restore_dir:/state" \
            "ghcr.io/depsilo/depsilo@${IMAGE_DIGEST}" \
            restore /state/depsilo-release-backup.tar.gz \
              --config-target /state/config.toml \
              --database-target /state/data/depsilo.db
          test "$(stat -c '%a' "$restore_dir/config.toml")" = "600"
          test "$(stat -c '%a' "$restore_dir/data/depsilo.db")" = "600"

          container_id="$(docker run --detach \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp/depsilo-home \
            --env DEPSILO_CONFIG=/state/config.toml \
            --env DEPSILO_DATABASE_DSN=/state/data/depsilo.db \
            --env DEPSILO_STORAGE_PATH=/state/data/cache \
            --publish 127.0.0.1::23333 \
            --volume "$restore_dir:/state" \
            "ghcr.io/depsilo/depsilo@${IMAGE_DIGEST}")"
          port="$(docker port "$container_id" 23333/tcp | sed 's/.*://')"
          restored_ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent "http://127.0.0.1:${port}/ready" >/dev/null; then
              restored_ready=true
              break
            fi
            if ! docker inspect --format '{{.State.Running}}' "$container_id" | grep -qx true; then
              docker logs "$container_id"
              exit 1
            fi
            sleep 2
          done
          test "$restored_ready" = true
          curl --fail --silent --show-error \
            --header 'Content-Type: application/json' \
            --data '{"username":"release-operator","password":"Release&Container-Password-47"}' \
            "http://127.0.0.1:${port}/api/v1/auth/login" \
            | jq -e '.token | length >= 24'

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2

      - name: Sign image manifests
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          for image in depsilo/depsilo ghcr.io/depsilo/depsilo; do
            cosign sign --yes "${image}@${IMAGE_DIGEST}"
          done

      - name: Generate image SBOM (CycloneDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ghcr.io/depsilo/depsilo@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: depsilo-${{ github.ref_name }}-image.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate image SBOM (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ghcr.io/depsilo/depsilo@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: depsilo-${{ github.ref_name }}-image.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest image SBOM and sign SBOM files
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cyclonedx="depsilo-${RELEASE_TAG}-image.cdx.json"
          for image in depsilo/depsilo ghcr.io/depsilo/depsilo; do
            cosign attest --yes --type cyclonedx --predicate "$cyclonedx" \
              "${image}@${IMAGE_DIGEST}"
          done
          for sbom in \
            "depsilo-${RELEASE_TAG}-image.cdx.json" \
            "depsilo-${RELEASE_TAG}-image.spdx.json"; do
            cosign sign-blob --yes --bundle "${sbom}.sigstore.json" "$sbom"
          done

      - name: Verify candidate trust gate
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          RELEASE_TAG: ${{ github.ref_name }}
          CERT_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
          OIDC_ISSUER: https://token.actions.githubusercontent.com
        run: |
          set -euo pipefail
          for image in depsilo/depsilo ghcr.io/depsilo/depsilo; do
            cosign verify \
              --certificate-identity "$CERT_IDENTITY" \
              --certificate-oidc-issuer "$OIDC_ISSUER" \
              "${image}@${IMAGE_DIGEST}" >/dev/null
            cosign verify-attestation \
              --type cyclonedx \
              --certificate-identity "$CERT_IDENTITY" \
              --certificate-oidc-issuer "$OIDC_ISSUER" \
              "${image}@${IMAGE_DIGEST}" >/dev/null
          done
          for sbom in \
            "depsilo-${RELEASE_TAG}-image.cdx.json" \
            "depsilo-${RELEASE_TAG}-image.spdx.json"; do
            cosign verify-blob \
              --bundle "${sbom}.sigstore.json" \
              --certificate-identity "$CERT_IDENTITY" \
              --certificate-oidc-issuer "$OIDC_ISSUER" \
              "$sbom" >/dev/null
          done

      - name: Upload image SBOMs to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            "depsilo-${{ github.ref_name }}-image.cdx.json" \
            "depsilo-${{ github.ref_name }}-image.spdx.json" \
            "depsilo-${{ github.ref_name }}-image.cdx.json.sigstore.json" \
            "depsilo-${{ github.ref_name }}-image.spdx.json.sigstore.json" \
            --clobber -R "${{ github.repository }}"

  # Promote only the trusted digest emitted by the successful candidate job.
  # A failed promotion can be retried without rebuilding: successful job
  # outputs are retained by GitHub, and every tag operation is idempotent.
  publish:
    needs: container_candidate
    concurrency:
      group: depsilo-release-promotion-${{ github.repository }}
      queue: max
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release planner
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # This check runs inside the repository-wide promotion lock. Git refs,
      # rather than published releases, are authoritative because a newer run
      # may have moved container tags before publishing its draft release.
      - name: Plan monotonic floating-tag promotion
        id: promotion_plan
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bash scripts/list-verified-release-tags.sh \
            "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$GITHUB_SHA" \
            | bash scripts/plan-release-promotion.sh "$GITHUB_REF_NAME" \
            >>"$GITHUB_OUTPUT"

      - name: Extract formal release tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: |
            depsilo/depsilo
            ghcr.io/depsilo/depsilo
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},priority=910
            type=semver,pattern={{major}}.{{minor}},priority=900,enable=${{ steps.promotion_plan.outputs.promote_floating == 'true' }}
            type=semver,pattern={{major}},priority=890,enable=${{ steps.promotion_plan.outputs.promote_floating == 'true' && !startsWith(github.ref_name, 'v0.') }}
            type=raw,value=latest,enable=${{ steps.promotion_plan.outputs.promote_floating == 'true' }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2

      - name: Verify trusted digest before promotion
        shell: bash
        env:
          IMAGE_DIGEST: ${{ needs.container_candidate.outputs.digest }}
          CERT_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
          OIDC_ISSUER: https://token.actions.githubusercontent.com
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          for image in depsilo/depsilo ghcr.io/depsilo/depsilo; do
            actual="$(docker buildx imagetools inspect "${image}@${IMAGE_DIGEST}" \
              --format '{{json .Manifest}}' | jq -er '.digest')"
            test "$actual" = "$IMAGE_DIGEST"
            cosign verify \
              --certificate-identity "$CERT_IDENTITY" \
              --certificate-oidc-issuer "$OIDC_ISSUER" \
              "${image}@${IMAGE_DIGEST}" >/dev/null
            cosign verify-attestation \
              --type cyclonedx \
              --certificate-identity "$CERT_IDENTITY" \
              --certificate-oidc-issuer "$OIDC_ISSUER" \
              "${image}@${IMAGE_DIGEST}" >/dev/null
          done

      - name: Promote trusted digest to release tags
        shell: bash
        env:
          IMAGE_DIGEST: ${{ needs.container_candidate.outputs.digest }}
          FORMAL_TAGS: ${{ steps.meta.outputs.tags }}
          FORMAL_VERSION: ${{ steps.meta.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_PROMOTE_FLOATING: ${{ steps.promotion_plan.outputs.promote_floating }}
        run: |
          set -euo pipefail

          resolve_tag_digest() {
            local reference="$1"
            local digest error_file output
            error_file="$(mktemp)"
            if output="$(docker buildx imagetools inspect "$reference" \
              --format '{{json .Manifest}}' 2>"$error_file")"; then
              rm -f "$error_file"
              if ! digest="$(jq -er \
                '.digest | select(test("^sha256:[0-9a-f]{64}$"))' <<<"$output")"; then
                echo "registry returned an invalid digest for $reference" >&2
                return 2
              fi
              printf '%s\n' "$digest"
              return 0
            fi
            if grep -Eqi 'not found|manifest unknown|name unknown' "$error_file"; then
              rm -f "$error_file"
              return 1
            fi
            cat "$error_file" >&2
            rm -f "$error_file"
            return 2
          }

          # Semver tags are immutable. Check both registries before writing any
          # tag, so a conflict cannot leave a half-promoted release.
          test -n "$FORMAL_VERSION"
          for image in depsilo/depsilo ghcr.io/depsilo/depsilo; do
            exact="${image}:${FORMAL_VERSION}"
            if existing="$(resolve_tag_digest "$exact")"; then
              if [ "$existing" != "$IMAGE_DIGEST" ]; then
                echo "refusing to replace immutable release tag $exact ($existing)" >&2
                exit 1
              fi
            else
              status=$?
              if [ "$status" -ne 1 ]; then
                echo "could not safely inspect release tag $exact" >&2
                exit "$status"
              fi
            fi
          done

          docker_exact=false
          ghcr_exact=false
          mapfile -t tags < <(printf '%s\n' "$FORMAL_TAGS" | sed '/^[[:space:]]*$/d')
          test "${#tags[@]}" -ge 2
          for tag in "${tags[@]}"; do
            repository="${tag%:*}"
            case "$repository" in
              depsilo/depsilo)
                [ "$tag" = "${repository}:${FORMAL_VERSION}" ] && docker_exact=true
                ;;
              ghcr.io/depsilo/depsilo)
                [ "$tag" = "${repository}:${FORMAL_VERSION}" ] && ghcr_exact=true
                ;;
              *)
                echo "refusing unexpected release repository: $tag" >&2
                exit 1
                ;;
            esac
          done
          [ "$docker_exact" = true ]
          [ "$ghcr_exact" = true ]

          # Re-read the authoritative refs immediately before the first tag
          # mutation. A moved release ref or a changed floating-tag decision
          # aborts rather than publishing metadata computed from stale input.
          rechecked_plan="$(
            bash scripts/list-verified-release-tags.sh \
              "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$GITHUB_SHA" \
              | bash scripts/plan-release-promotion.sh "$GITHUB_REF_NAME"
          )"
          rechecked_promote="$(sed -n 's/^promote_floating=//p' <<<"$rechecked_plan")"
          if [[ ! "$rechecked_promote" =~ ^(true|false)$ ]] \
            || [ "$rechecked_promote" != "$EXPECTED_PROMOTE_FLOATING" ]; then
            echo "release promotion decision changed before tag mutation" >&2
            exit 1
          fi

          for tag in "${tags[@]}"; do
            repository="${tag%:*}"
            docker buildx imagetools create \
              --tag "$tag" \
              "${repository}@${IMAGE_DIGEST}"
          done

      - name: Verify promoted release tags
        shell: bash
        env:
          IMAGE_DIGEST: ${{ needs.container_candidate.outputs.digest }}
          FORMAL_TAGS: ${{ steps.meta.outputs.tags }}
          CERT_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
          OIDC_ISSUER: https://token.actions.githubusercontent.com
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            actual="$(docker buildx imagetools inspect "$tag" \
              --format '{{json .Manifest}}' | jq -er '.digest')"
            test "$actual" = "$IMAGE_DIGEST"
            cosign verify \
              --certificate-identity "$CERT_IDENTITY" \
              --certificate-oidc-issuer "$OIDC_ISSUER" \
              "$tag" >/dev/null
          done <<<"$FORMAL_TAGS"

      - name: Publish trusted GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROMOTE_FLOATING: ${{ steps.promotion_plan.outputs.promote_floating }}
        shell: bash
        run: |
          set -euo pipefail
          publication_plan="$(
            bash scripts/list-verified-release-tags.sh \
              "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$GITHUB_SHA" \
              | bash scripts/plan-release-promotion.sh "$GITHUB_REF_NAME"
          )"
          publication_promote="$(sed -n 's/^promote_floating=//p' <<<"$publication_plan")"
          if [[ ! "$publication_promote" =~ ^(true|false)$ ]] \
            || [ "$publication_promote" != "$PROMOTE_FLOATING" ]; then
            echo "release promotion decision changed before GitHub publication" >&2
            exit 1
          fi
          if [ "$PROMOTE_FLOATING" = true ]; then
            gh release edit "${{ github.ref_name }}" --draft=false --latest \
              -R "${{ github.repository }}"
          else
            gh release edit "${{ github.ref_name }}" --draft=false --latest=false \
              -R "${{ github.repository }}"
          fi
