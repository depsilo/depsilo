name: Build and Publish Docker Image

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write   # write needed to attach the image SBOM to the GitHub Release
  packages: write

env:
  DOCKERHUB_IMAGE: depsilo/depsilo
  GHCR_IMAGE: ghcr.io/depsilo/depsilo

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            depsilo/depsilo
            ghcr.io/depsilo/depsilo
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
          labels: |
            org.opencontainers.image.title=Depsilo
            org.opencontainers.image.description=Lightweight self-hosted dependency cache for pip, apt, npm and more
            org.opencontainers.image.url=https://depsilo.com
            org.opencontainers.image.source=https://github.com/depsilo/depsilo
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── SBOM: container image (the actually-deployed artifacts) ───
      # Scans the just-pushed multi-arch image and emits CycloneDX +
      # SPDX SBOMs. Together with the source SBOM from release.yml,
      # these give a complete picture: source SBOM = what we asked
      # for, image SBOM = what ran. Both are attached to the GitHub
      # Release for the same tag.
      #
      # Un-signed in v0.7.x; cosign-attest layers on top once T0 #2
      # (signed releases) lands. The image is scanned only once even
      # though the manifest is multi-arch — Syft resolves to a single
      # image reference here; per-arch SBOMs can come later if a
      # buyer needs them.
      - name: Generate image SBOM (CycloneDX)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/depsilo/depsilo:${{ github.ref_name }}
          format: cyclonedx-json
          output-file: depsilo-${{ github.ref_name }}-image.cdx.json
          upload-artifact: false
          upload-release-assets: true

      - name: Generate image SBOM (SPDX)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/depsilo/depsilo:${{ github.ref_name }}
          format: spdx-json
          output-file: depsilo-${{ github.ref_name }}-image.spdx.json
          upload-artifact: false
          upload-release-assets: true
