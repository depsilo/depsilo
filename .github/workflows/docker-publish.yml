name: Build and Publish Docker Image

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write   # write needed to attach the image SBOM to the GitHub Release
  packages: write

env:
  DOCKERHUB_IMAGE: depsilo/depsilo
  GHCR_IMAGE: ghcr.io/depsilo/depsilo

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            depsilo/depsilo
            ghcr.io/depsilo/depsilo
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
          labels: |
            org.opencontainers.image.title=Depsilo
            org.opencontainers.image.description=Supply-chain enforcement proxy for 14 ecosystems and Docker OCI
            org.opencontainers.image.url=https://depsilo.com
            org.opencontainers.image.source=https://github.com/depsilo/depsilo
            org.opencontainers.image.licenses=MIT

      - name: Build date
        id: date
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # The Dockerfile has carried these ARGs since the unified
          # entrypoint landed, but nothing passed them — every published
          # image reported "Depsilo dev (commit: unknown)" (v0.8.0
          # postmortem). steps.meta.outputs.version is the un-prefixed
          # semver on tags and the branch name on branch builds.
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.date.outputs.date }}

      # ── SBOM: container image (the actually-deployed artifacts) ───
      # Scans the just-pushed multi-arch image and emits CycloneDX +
      # SPDX SBOMs. Together with the source SBOM from release.yml,
      # these give a complete picture: source SBOM = what we asked
      # for, image SBOM = what ran. Both are attached to the GitHub
      # Release for the same tag.
      #
      # Currently unsigned; cosign-attest layers on top once T0 #2
      # (signed releases) lands. The image is scanned only once even
      # though the manifest is multi-arch — Syft resolves to a single
      # image reference here; per-arch SBOMs can come later if a
      # buyer needs them.
      # Two v0.8.0 postmortem fixes baked in (both failed on the first
      # tag that exercised this path):
      # 1. Image tags come from metadata-action's semver patterns and
      #    carry NO "v" prefix — `github.ref_name` (v0.8.0) pointed at
      #    a manifest that doesn't exist. Use steps.meta.outputs.version.
      # 2. Scan the Docker Hub image, not ghcr — Syft's registry
      #    provider hit UNAUTHORIZED on ghcr even after docker login
      #    (it doesn't read the daemon's cred store), and the Docker
      #    Hub package is the publicly documented install path anyway.
      - name: Generate image SBOM (CycloneDX)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: anchore/sbom-action@v0
        with:
          image: depsilo/depsilo:${{ steps.meta.outputs.version }}
          format: cyclonedx-json
          output-file: depsilo-${{ github.ref_name }}-image.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate image SBOM (SPDX)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: anchore/sbom-action@v0
        with:
          image: depsilo/depsilo:${{ steps.meta.outputs.version }}
          format: spdx-json
          output-file: depsilo-${{ github.ref_name }}-image.spdx.json
          upload-artifact: false
          upload-release-assets: false

      # sbom-action's own upload-release-assets only fires on `release`
      # events; this workflow triggers on tag PUSH, so it silently
      # skipped (v0.8.0 postmortem). Upload explicitly instead. The
      # Release workflow creates the release for the same tag; --clobber
      # keeps a re-run idempotent, and the retry loop covers the race
      # where this job outruns GoReleaser creating the release.
      - name: Upload image SBOMs to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in 1 2 3 4 5; do
            if gh release upload "${{ github.ref_name }}" \
                 "depsilo-${{ github.ref_name }}-image.cdx.json" \
                 "depsilo-${{ github.ref_name }}-image.spdx.json" \
                 --clobber -R "${{ github.repository }}"; then
              exit 0
            fi
            echo "release not ready yet, retry $i/5 in 60s"
            sleep 60
          done
          exit 1
