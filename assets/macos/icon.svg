<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Depsilo</title>
  <!--
    The app icon from docs/brand/depsilo-app-icon-light.svg, on the platform's
    rounded square. The brand kit ships a full square; macOS renders bundle
    icons with their own shape, so the rounding is applied here rather than
    left to the launcher. The Linux tray icon reuses this same file.

    The kit's app icon uses the gradient mark. This file uses the flat variant
    instead, because the install scripts fall back to ImageMagick when
    rsvg-convert is absent, and ImageMagick paints a referenced gradient black
    — which would ship a black tray icon to Linux desktops without librsvg.
  -->
  <rect width="1024" height="1024" rx="225" fill="#FFFFFF"/>
  <g transform="translate(128,128) scale(3)">
    <path d="M28 76 L108 30 L108 62 L60 90 L60 166 L108 194 L108 226 L28 180 Z" fill="#2563EB"/>
    <path d="M124 20 L228 80 L228 176 L124 236 L124 204 L196 162 L196 98 L124 56 Z" fill="#3B82F6"/>
    <path d="M128 88 L170 112 L128 136 L86 112 Z" fill="#22C55E"/>
    <path d="M86 122 L128 146 L170 122 L170 160 L128 184 L86 160 Z" fill="#16A34A"/>
  </g>
</svg>
