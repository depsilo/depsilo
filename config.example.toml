config_version = 1

[server]
host = "0.0.0.0"
port = 23333
log_level = "info"
# Empty means X-Forwarded-For / X-Real-IP are ignored. Add only the CIDRs of
# reverse proxies you operate, for example ["127.0.0.1/32", "10.0.0.0/8"].
trusted_proxies = []

[database]
driver = "sqlite"           # currently the only supported database driver
dsn    = "./data/depsilo.db"

[storage]
type = "local"              # local | s3
path = "./data/cache"

# S3 配置（type = "s3" 时生效）
# bucket   = "depsilo"
# endpoint = "http://minio:9000"
# region   = "us-east-1"
# access_key = ""
# secret_key = ""

[cache]
max_size_gb  = 20
ttl_index    = "1h"         # 索引元数据刷新间隔（过期后同步刷新；上游失败时返回旧索引）
ttl_blob     = "72h"        # wheel / .deb 文件
lru_threshold = 90          # 使用率超过此百分比触发 LRU 清理

# 可选：为下游 ccache / sccache 提供本机或团队共享的编译产物缓存。
# 该存储必须与上面的包缓存隔离；启用后通过 Admin API 创建 namespace 凭据。
# 当前只支持单 Depsilo 实例，多个实例不能共享下面的目录/bucket 和容量账本。
[compile_cache]
enabled = false
# 编译缓存客户端实际访问的外部 origin。远程部署建议填 TLS 反向代理地址，
# 并确保 Depsilo 后端 HTTP 端口只对该代理或受信网络开放。
public_url = "http://127.0.0.1:23333"
# 仅在可信 LAN/VPN 且明确接受 bearer 明文传输风险时开启。
allow_insecure_http = false
max_size_gb = 20
max_entries = 500000
max_entry_size_mb = 512
namespace_max_size_gb = 20
namespace_max_entries = 250000
max_concurrent_uploads = 8
# 并发槽位之外最多允许等待的上传；队列满时快速返回 503。
max_queued_uploads = 32
# 单次上传的最长时间；超时会关闭请求体并释放上传槽位。
upload_timeout = "15m"
# 慢速下载的并发与最长传输时间，防止长期占用文件或 S3 响应体。
max_concurrent_downloads = 64
download_timeout = "15m"
# 所有并发上传的暂存数据总上限，且不能小于 max_entry_size_mb。
max_inflight_upload_size_mb = 1024
lru_threshold = 90

[compile_cache.storage]
type = "local"              # local | s3
path = "./data/compile-cache"
# 这里的 S3 仅是 Depsilo 内部对象存储，不会向客户端暴露 S3 API。
# S3 必须使用独立 bucket，不能与包缓存共用；关闭 versioning 或配置版本生命周期。
# bucket = "depsilo-compile-cache"
# endpoint = "http://minio:9000"
# region = "us-east-1"
# access_key = ""
# secret_key = ""

# 对已缓存且具备 HTTP 验证器的 PyPI 兼容元数据主动执行条件检查。
# 不支持可靠变更判定的生态继续依赖正常 TTL 刷新；此任务绝不预拉取制品。
[upstream_updates]
enabled = true
check_interval = "1h"

[access_log]
# Async rollup pipeline for the access_logs table. See
# docs/specs/2026-06-26-access-log-rollup.md.
#
# DELETION WARNING: retention_days and rollup_retention_days physically
# DELETE rows older than the configured horizon. Set either to 0 to keep
# data forever (no sweep).
rollup_enabled        = true   # write hourly + package_daily rollups
batch_size            = 100    # flush after this many rows
batch_interval        = "5s"   # ...or this much time, whichever first
backfill_on_start     = true   # one-shot fill rollups from existing rows on boot
retention_days        = 7      # raw access_logs sweep horizon (0 = never sweep)
rollup_retention_days = 365    # rollup tables sweep horizon (0 = never sweep)

[auth]
enabled    = true
# Startup refuses this placeholder while listening on a non-loopback address.
# Prefer an environment secret: DEPSILO_AUTH_JWT_SECRET="$(openssl rand -hex 32)"
jwt_secret = "change-me-in-production"
token_ttl  = "168h"         # 7天

[license]
key = ""   # Leave empty for Community edition, set License Key for Pro

# On the first start after upgrading, Depsilo imports ordinary ecosystem upstreams
# into the database and records the active ecosystems. After that seed, Admin and
# the database are authoritative: deleting or editing an upstream is not overwritten
# by later restarts. Adding upstreams in config for a previously inactive supported
# ecosystem activates it on the next restart. Docker registries and extra indexes
# remain config-owned and are not managed by Admin Upstream CRUD.

[[pypi.upstreams]]
name     = "tuna"
url      = "https://pypi.tuna.tsinghua.edu.cn"
priority = 1

[[pypi.upstreams]]
name     = "official"
url      = "https://pypi.org"
priority = 2
# proxy    = "http://your-proxy:7890"   # 可选，单独给此上游配 HTTP 代理

