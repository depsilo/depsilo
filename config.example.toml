# proxy = "http://127.0.0.1:7890"   # optional per-upstream HTTP proxy
# A configured proxy resolves redirected artifact hostnames. Its egress policy
# should block loopback/link-local/private targets unless intentionally needed.

[docker]
default_registry = "docker.io"

[[docker.registries]]
name     = "dockerhub"
url      = "https://registry-1.docker.io"
# username = ""
# password = ""
# proxy    = "http://127.0.0.1:7890"
# Every registry, Bearer realm, and redirect hostname is resolved locally and
# checked against the registry's pinned network scope before a proxied request.
# A forward proxy can resolve the same hostname differently, so its DNS policy
# and egress ACL remain a trust boundary and must reject unintended internal
# targets. Registries may nominate a public cross-origin Bearer realm (Docker
# Hub uses auth.docker.io); configuring credentials trusts that delegation.

# [[docker.registries]]
# name     = "ghcr"
# url      = "https://ghcr.io"
# username = "github-user"
# password = "ghp_xxx"

# ─── Extra PyPI-compatible indexes ───────────
# The built-in PyTorch channel family is enabled by default. It registers
# /pypi-torch/{channel}/simple/ without contacting the upstream until first use.
# Use the channel suffix from PyTorch's official install URL (for example cpu,
# cu..., or rocm...). Artifact URLs declared by each channel are signed by
# Depsilo and fetched through an isolated cache namespace.
[extra_index_presets]
enabled = true
# disabled = ["pytorch"]

# Proxy additional PyPI-compatible indexes at custom paths. Artifact links
# declared by every extra index are signed and cached automatically, so CDN
# host lists are not required. `simple_path` controls the package-list path
# below each upstream: normal PyPI mirrors use "/simple"; flat indexes such as
# download.pytorch.org use "/".
# `name` must be a unique URL-safe slug of at most 128 bytes, without surrounding
# whitespace. `path` may contain multiple literal segments (for example
# "python/private"), but must be unique and must not use Depsilo's occupied
# roots such as api, admin, pypi, assets, p, or v2.
#
# [[extra_indexes]]
# name = "company-python"
# path = "python/company"
# [[extra_indexes.upstreams]]
# name = "company"
# url = "https://packages.example.com/python"
# priority = 1
# probe_mode = "passive"
# [[extra_indexes]]
# name = "vllm-cu130"
# path = "pypi-vllm-cu130"
# [[extra_indexes.upstreams]]
# name = "vllm-wheels"
# url = "https://wheels.vllm.ai/0.19.1/cu130"
# priority = 1
#
# Usage:
#   PYTORCH_CHANNEL=cpu
#   pip install torch --index-url http://HOST:PORT/pypi-torch/${PYTORCH_CHANNEL}/simple/

[security]
enabled = true
osv_api_url = "https://api.osv.dev"
scan_interval = "24h"
check_ttl = "24h"
# proxy = "http://127.0.0.1:7890"

# ─── Minimum release age — npm, PyPI, Composer, NuGet, Cargo, RubyGems ──
#
# npm enforces the gate from the packument's time[version], carried inside the
# same authenticated token that pins the tarball to its serving Upstream.
# PyPI enforces it from the PEP 691 JSON simple index's upload-time for the
# artifact URL declared by the same Upstream; mirrors that only serve HTML
# (for example some Aliyun mirrors) fail closed while the PyPI gate is enabled.
# Composer enforces it from the p2 metadata entry's own time field. Composer
# clients fall back to the original dist URL after a 451, so the Composer gate
# provides caching, audit events, and best-effort blocking rather than hard
# enforcement without egress control.
# NuGet enforces it from the v3 registration index's published timestamp for
# the same immutable package version; the 1900 unlisted sentinel is treated as
# missing provenance and fails closed.
# Cargo enforces it from the sparse index entry's pubtime for the exact version
# and checksum; entries without pubtime fail closed.
# RubyGems resolves the compact-index created_at and checksum for the exact
# `.gem` artifact; entries without created_at or an ambiguous filename fail
# closed.
# Conda can be enabled with approximate Last-Modified provenance, but only
# after listing it in approximate_sources below. The capability summary labels
# it approximate rather than source-bound.
# CRAN uses the DESCRIPTION Date/Publication for the current source tarball and
# the artifact's Last-Modified for archives and binaries; it requires the same
# approximate acknowledgement.
# Maven and Alpine HEAD the exact artifact through the configured upstream and
# use its Last-Modified; both require the same approximate acknowledgement.
# Helm resolves the chart identity from the same upstream's index.yaml (the
# filename cannot be split safely) and HEADs the exact chart for its
# Last-Modified; it requires the same approximate acknowledgement too.
# Every other ecosystem still rejects positive thresholds at startup because
# its artifact source and timestamp are not yet bound end to end.
#
# Enable the gate and set a positive npm or PyPI threshold to quarantine fresh
# versions; leave the other thresholds at zero. Positive defaults and positive
# thresholds for unbound ecosystems are startup errors. Missing or legacy
# metadata without a publish time fails closed while the gate is enabled.

[supply_chain]
min_release_age_enabled = false
mode = "block"
fail_closed = true
# Ecosystems whose positive thresholds rely on approximate Last-Modified
# provenance must be listed explicitly, for example
# ["conda", "cran", "maven", "alpine", "helm"]. Docker does not provide that
# provenance yet, so listing it here has no effect and its positive threshold
# stays rejected at startup.
approximate_sources = []

# Ecosystems whose positive thresholds rely on first-observation age — the
# clock starts when this instance first pulls the artifact digest, not when
# the publisher released it. Only adapters that record observations are bound;
# listing anything else has no effect. Currently Docker: its registries expose
# no portable publish time, so a positive docker threshold requires this
# acknowledgement, and unseen digests stay quarantined until the threshold
# passes (approve individual images through the quarantine approvals flow).
# observation_sources = ["docker"]
observation_sources = []

[supply_chain.min_release_age]
default  = "0"
pypi     = "0"   # e.g. "3d"; requires a PEP 691 JSON simple-index upstream
npm      = "0"   # e.g. "7d" once min_release_age_enabled = true
go       = "0"
cargo    = "0"   # e.g. "3d"; uses the sparse index pubtime field
maven    = "0"   # e.g. "3d"; requires approximate_sources = ["maven"]
rubygems = "0"   # e.g. "3d"; uses the compact index created_at field
composer = "0"   # best-effort: clients can fall back to the original dist URL
nuget    = "0"   # e.g. "3d"; uses the v3 registration published timestamp
conda    = "0"   # e.g. "3d"; requires approximate_sources = ["conda"]
cran     = "0"   # e.g. "3d"; requires approximate_sources = ["cran"]
helm     = "0"   # e.g. "3d"; resolves identity from index.yaml; requires approximate_sources = ["helm"]
alpine   = "0"   # e.g. "3d"; requires approximate_sources = ["alpine"]
docker   = "0"   # e.g. "3d"; requires observation_sources = ["docker"]
huggingface = "0"
apt      = "0"

# ── Known-malicious blocklist ─────────────────────────────────────────
# Syncs OSV MAL-* records for npm, pypi, cargo, rubygems, composer, nuget,
# go, and maven. Explicit version lists and all-version advisories are
# imported; bounded ranges without a version list are skipped.
# PyPI resolves legacy archive filenames (.zip, .egg, .tar.bz2, …) through
# the declaring package's simple index, and RubyGems resolves the exact gem
# (including platform artifacts) through the compact index. An artifact whose
# identity cannot be proven is refused while the dataset covers it, so a
# non-standard filename cannot bypass the blocklist. Upstreams for those two
# ecosystems must serve the corresponding index metadata.
# Records may carry GHSA aliases.
# The quarantine allow-list CANNOT bypass a malware match — the only
# exemption is an audited admin override that expires after 24h.
# mode controls the response to a known-malicious match:
#   block (default) — refuse the request with 451 MALICIOUS_BLOCKED
#   warn            — serve the request and record malware_warned
# Enabled by default; sync failures degrade (last good data keeps
# blocking, an empty local store blocks nothing) and never break the
# proxy itself.
[supply_chain.blocklist]
enabled       = true
sync_interval = "6h"
# mode          = "block"
# mirror_url  = "https://osv-vulnerabilities.storage.googleapis.com"
# proxy       = "http://127.0.0.1:7890"   # required in mainland China

# ── Compliance (CRA-mode SBOM technical file) ─────────────────────────
# The per-project SBOM export (Pro) always emits purl and version. Adding
# ?cra=true, or the "CRA technical file" option in the Admin UI, adds the
# NTIA/CRA minimum elements: SHA-256 checksums from tamper detection,
# supplier/license fields, and explicit dependency relationships from the
# product to each component. Depsilo never invents supplier or license
# values: declare them below, or the component exports as unknown
# (NOASSERTION) and the technical-file manifest reports the gap.
[compliance]
# Manufacturer/supplier of the product described by the technical file.
organization = ""
# Security contact published in the technical file.
contact = ""
# Optional Ed25519 PKCS#8 PEM key that signs CRA exports (?sign=true).
#   openssl genpkey -algorithm ed25519 -out /etc/depsilo/sbom-signing-key.pem
# signing_key_file = "/etc/depsilo/sbom-signing-key.pem"

# Per-package facts. The ID is "<ecosystem>:<package>" for every version or
# "<ecosystem>:<package>@<version>" for one version; the version-specific
# entry wins per field when both exist.
# [[compliance.components]]
# id       = "pypi:requests"
# supplier = "Python Software Foundation"
# license  = "Apache-2.0"

# ── Audit chain anchoring ─────────────────────────────────────────────
# The audit log is hash-chained (schema v8). Anchoring writes periodic
# checkpoints of the chain head to an append-only file, so rewriting the whole
# database becomes detectable: `depsilo audit verify` and the audit page
# compare the stored chain against these checkpoints. Point the file at a
# different volume, bucket, or backup target than the SQLite database — a
# checkpoint saved next to the database adds little.
[audit]
checkpoint_file     = ""
checkpoint_interval = "15m"
# Optional remote anchor: the same NDJSON checkpoint line is POSTed to this
# endpoint (WORM gateway, log platform, or a service that timestamps on
# receipt). Receivers should deduplicate on (head_id, head_hash); a failed
# delivery retries after 60s. The URL and token are never returned by the API.
# checkpoint_url   = "https://worm.example/audit-anchors"
# checkpoint_token = ""

# ── Tamper detection (content integrity of immutable artifacts) ──
# Records the SHA-256 of each immutable artifact (wheel/.crate/.gem/…)
# on first fetch. When the artifact is naturally re-fetched (background
# refresh) and the upstream bytes differ, depsilo keeps the trusted
# first-seen copy, refuses to cache the new content, and fires a
# critical alert — a registry silently swapping bytes under the same
# version is a supply-chain compromise signal. Alert-only; never blocks.
[supply_chain.tamper_detection]
enabled = true
