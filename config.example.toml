[server]
host = "0.0.0.0"
port = 23333

[database]
driver = "sqlite"           # sqlite | postgres
dsn    = "./data/depsilo.db"

[storage]
type = "local"              # local | s3
path = "./data/cache"

# S3 配置（type = "s3" 时生效）
# bucket   = "depsilo"
# endpoint = "http://minio:9000"
# region   = "us-east-1"
# access_key = ""
# secret_key = ""

[cache]
max_size_gb  = 20
ttl_index    = "5m"         # PyPI simple / APT Release 等元数据
ttl_blob     = "72h"        # wheel / .deb 文件
lru_threshold = 90          # 使用率超过此百分比触发 LRU 清理

[auth]
enabled    = true
jwt_secret = "change-me-in-production"   # ⚠ MUST change before production deployment!
token_ttl  = "168h"         # 7天

[[pypi.upstreams]]
name     = "tuna"
url      = "https://pypi.tuna.tsinghua.edu.cn"
priority = 1

[[pypi.upstreams]]
name     = "official"
url      = "https://pypi.org"
priority = 2
# proxy    = "http://your-proxy:7890"   # 可选，单独给此上游配 HTTP 代理

[[apt.upstreams]]
name     = "tuna"
url      = "https://mirrors.tuna.tsinghua.edu.cn"
priority = 1

[[apt.upstreams]]
name     = "aliyun"
url      = "https://mirrors.aliyun.com"
priority = 2

[[npm.upstreams]]
name     = "npmmirror"
url      = "https://registry.npmmirror.com"
priority = 1

[[npm.upstreams]]
name     = "official"
url      = "https://registry.npmjs.org"
priority = 2
proxy    = "http://127.0.0.1:7890"

[[go.upstreams]]
name     = "goproxy-cn"
url      = "https://goproxy.cn"
priority = 1

[[go.upstreams]]
name     = "official"
url      = "https://proxy.golang.org"
priority = 2
proxy    = "http://127.0.0.1:7890"

[[cargo.upstreams]]
name     = "rsproxy"
url      = "https://rsproxy.cn/index"
priority = 1

[[cargo.upstreams]]
name     = "crates-io"
url      = "https://index.crates.io"
priority = 2
proxy    = "http://127.0.0.1:7890"

[[maven.upstreams]]
name     = "aliyun"
url      = "https://maven.aliyun.com/repository/public"
priority = 1

[[maven.upstreams]]
name     = "central"
url      = "https://repo1.maven.org/maven2"
priority = 2
proxy    = "http://127.0.0.1:7890"

[[rubygems.upstreams]]
name     = "ruby-china"
url      = "https://gems.ruby-china.com"
priority = 1

[[rubygems.upstreams]]
name     = "rubygems"
url      = "https://rubygems.org"
priority = 2
proxy    = "http://127.0.0.1:7890"

[[composer.upstreams]]
name     = "aliyun"
url      = "https://mirrors.aliyun.com/composer"
priority = 1

[[composer.upstreams]]
name     = "packagist"
url      = "https://repo.packagist.org"
priority = 2
proxy    = "http://127.0.0.1:7890"
