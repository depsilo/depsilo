# ─── Extra PyPI-compatible indexes ───────────
# Proxy additional PyPI indexes at custom paths.
# Useful for CUDA-specific wheels (PyTorch, vLLM).
#
# [[extra_indexes]]
# name = "pytorch-cu130"
# path = "pypi-torch-cu130"
# [[extra_indexes.upstreams]]
# name = "pytorch"
# url = "https://download.pytorch.org/whl/cu130"
# priority = 1
#
# [[extra_indexes]]
# name = "vllm-cu130"
# path = "pypi-vllm-cu130"
# [[extra_indexes.upstreams]]
# name = "vllm-wheels"
# url = "https://wheels.vllm.ai/0.19.1/cu130"
# priority = 1
#
# Usage:
#   pip install torch --index-url http://HOST:PORT/pypi-torch-cu130/simple/

[security]
enabled = true
osv_api_url = "https://api.osv.dev"
scan_interval = "24h"
check_ttl = "24h"
# proxy = "http://127.0.0.1:7890"

# ─── Supply-chain quarantine — minimum release age ──────────────────────
#
# Refuses to serve any package version whose upstream publish time is
# younger than the configured threshold. Mitigates Shai-Hulud-style
# self-propagating worms by giving the community a window to catch
# and yank a poisoned version before it can enter a build.
#
# Threshold values accept "3d" / "7d" / "2w" / "24h" / "30m" / "0".
# Set "0" explicitly to disable quarantine for a supported ecosystem.
# Omitting a key retains its built-in value. The defaults shown below
# match the current implementation; override only what you want to change.
#
# Mode: only "block" is implemented. Other values fail at startup so a
# configuration mistake cannot silently weaken enforcement.
#
# Allow rules bypass the check for trusted pins. Three syntaxes:
#   npm:@scope/internal-*         — glob match on package name
#   pypi:requests==2.32.3         — exact pin on (name, version)
#   npm:react>=18.0.0             — range comparator on a name
#
# Operators can also approve individual (package, version) pairs at
# runtime via the admin UI — those approvals persist permanently.
#
# fail_closed controls not-found / unsupported timestamp results:
#   true  (default) — treat as quarantined (safer)
#   false           — allow through (legacy / opt-in)
# A genuine upstream outage always allows with a warning; one registry
# incident must not halt every build.

[supply_chain]
mode = "block"
fail_closed = true

# allow = [
#   "npm:@your-org/internal-*",
#   "pypi:requests==2.32.3",
#   "npm:react>=18.0.0",
# ]

[supply_chain.min_release_age]
# Fallback for unknown/future ecosystem keys only. Supported ecosystems use
# their built-in threshold unless explicitly overridden below.
default  = "0"
pypi     = "3d"
npm      = "7d"
go       = "0"     # no publish-time resolver; keep zero (checksum DB protects Go modules)
cargo    = "3d"
maven    = "3d"
rubygems = "3d"
composer = "3d"
nuget    = "3d"
conda    = "3d"
cran     = "3d"
helm     = "3d"
alpine   = "3d"
docker   = "3d"
huggingface = "3d"
apt      = "0"     # APT has no quarantine gate yet; keep this at zero

# ── Known-malicious blocklist (hard block, 451 MALICIOUS_BLOCKED) ──
# Syncs OSV MAL-* records for npm, pypi, cargo, rubygems, composer, nuget,
# go, and maven. Explicit version lists and all-version advisories are
# imported; bounded ranges without a version list are skipped.
# Records may carry GHSA aliases. Matched versions are refused outright.
# The quarantine allow-list CANNOT bypass a malware match — the only
# exemption is an audited admin override that expires after 24h.
# Enabled by default; sync failures degrade (last good data keeps
# blocking, an empty local store blocks nothing) and never break the
# proxy itself.
[supply_chain.blocklist]
enabled       = true
sync_interval = "6h"
# mirror_url  = "https://osv-vulnerabilities.storage.googleapis.com"
# proxy       = "http://127.0.0.1:7890"   # required in mainland China

# ── Tamper detection (content integrity of immutable artifacts) ──
# Records the SHA-256 of each immutable artifact (wheel/.crate/.gem/…)
# on first fetch. When the artifact is naturally re-fetched (background
# refresh) and the upstream bytes differ, depsilo keeps the trusted
# first-seen copy, refuses to cache the new content, and fires a
# critical alert — a registry silently swapping bytes under the same
# version is a supply-chain compromise signal. Alert-only; never blocks.
[supply_chain.tamper_detection]
enabled = true
