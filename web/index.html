<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Depsilo</title>
    <!-- Machine-readable description of this service for scripts and AI agents. -->
    <link rel="alternate" type="application/json" href="/api/v1/discover" />
    <script>
      // Pre-paint theme init — runs before React mounts so the user
      // never sees a flash of the wrong theme. Reads the new
      // "depsilo-theme" key, falls back to the legacy "theme" key
      // for users with the previous build, and defaults to "dark"
      // when neither exists (Instrument default).
      (function(){
        var KEY = 'depsilo-theme';
        var t = 'dark';
        try {
          t = window.localStorage.getItem(KEY) || window.localStorage.getItem('theme') || t;
        } catch (_) {
          // Storage may be blocked in hardened browser contexts. Theme
          // persistence is optional, so keep the Instrument default.
        }
        if (t !== 'light' && t !== 'dark' && t !== 'system') t = 'dark';
        var resolved = t;
        if (t === 'system') {
          resolved = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
        }
        document.documentElement.classList.add(resolved);
        document.documentElement.setAttribute('data-theme', resolved);
      })();

    </script>
  </head>
  <body>
    <noscript>This page needs JavaScript. Scripts and AI agents: read <a href="/api/v1/discover">/api/v1/discover</a> for a JSON description of this service, and <a href="/api/v1/integration-prompt">/api/v1/integration-prompt</a> for the plain-text project integration prompt.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
