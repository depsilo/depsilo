<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Depsilo</title>
    <!-- Machine-readable description of this service for scripts and AI agents. -->
    <link rel="alternate" type="application/json" href="/api/v1/discover" />
    <!-- Lets the browser paint its canvas and native controls in the right
         scheme before any CSS loads; the script below narrows it. -->
    <meta name="color-scheme" content="light dark" />
    <script>
      // Pre-paint theme init, before React mounts, so the page never flashes
      // the wrong scheme. A stored "light" or "dark" pins the scheme; anything
      // else, including no stored value, follows the system preference.
      (function(){
        var t = 'system';
        try {
          t = window.localStorage.getItem('depsilo-theme') || t;
        } catch (_) {
          // Storage may be blocked in hardened browser contexts; persistence
          // is optional, so follow the system preference.
        }
        var resolved = t === 'light' || t === 'dark' ? t
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        var root = document.documentElement;
        root.classList.add(resolved);
        root.setAttribute('data-theme', resolved);
        document.querySelector('meta[name="color-scheme"]').content = resolved;
      })();
    </script>
  </head>
  <body>
    <noscript>This page needs JavaScript. Scripts and AI agents: read <a href="/api/v1/discover">/api/v1/discover</a> for a JSON description of this service, and <a href="/api/v1/integration-prompt">/api/v1/integration-prompt</a> for the plain-text project integration prompt.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
