<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>web</title>
    <script>
      // Pre-paint theme init — runs before React mounts so the user
      // never sees a flash of the wrong theme. Reads the new
      // "depsilo-theme" key, falls back to the legacy "theme" key
      // for users with the previous build, and defaults to "dark"
      // when neither exists (Instrument default).
      (function(){
        var KEY = 'depsilo-theme';
        var t = localStorage.getItem(KEY) || localStorage.getItem('theme');
        if (t !== 'light' && t !== 'dark' && t !== 'system') t = 'dark';
        var resolved = t;
        if (t === 'system') {
          resolved = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
        }
        document.documentElement.classList.add(resolved);
        document.documentElement.setAttribute('data-theme', resolved);
      })();

      // Font-load gate. CSS .icon entries (Material Symbols) stay
      // visibility: hidden until this class lands, so the brief
      // window between first paint and Material Symbols loading
      // doesn't render the literal ligature text inside icon slots.
      // document.fonts.ready resolves when all CSS-declared fonts
      // the document has triggered finish loading; layout space
      // is already reserved by .icon's 1em × 1em box so toggling
      // visibility produces zero shift.
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(function(){
          document.documentElement.classList.add('fonts-ready');
        });
      } else {
        // Ancient browser fallback — just show icons immediately,
        // they'll FOUC but won't be invisible forever.
        document.documentElement.classList.add('fonts-ready');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
