# staticcheck configuration; `make lint-go` runs it.
# ST1005 stays off: many error strings begin with an ecosystem's proper name
# ("Hugging Face", "Docker", "Debian", "Maven") and reach Operators verbatim
# as validation messages. The other disabled ST checks are staticcheck's own
# defaults (package comments, initialisms, receiver names).
checks = ["all", "-ST1000", "-ST1003", "-ST1005", "-ST1016", "-ST1020", "-ST1021", "-ST1022"]
