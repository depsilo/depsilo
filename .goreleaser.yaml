version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: depsilo
    main: ./cmd/depsilo
    binary: depsilo
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X depsilo/internal/version.Version={{.Version}}
      - -X depsilo/internal/version.Commit={{.Commit}}
      - -X depsilo/internal/version.BuildDate={{.Date}}
    hooks:
      post:
        # Windows binary gets .exe extension naturally; on unix, ensure executable bit
        - cmd: chmod +x {{ .Path }}
          env:
            - "{{ if ne .Os \"windows\" }}true{{ end }}"

archives:
  - id: default
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    files:
      - config.example.toml
      - docker-compose.yml
      - README.md
      - LICENSE
    name_template: "depsilo_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: depsilo
    name: depsilo
  prerelease: auto
  draft: false
  extra_files:
    - glob: ./install.sh

# Homebrew tap formula generation.
#
# `skip_upload: true` because depsilo/homebrew-tap doesn't exist yet — goreleaser
# still writes the formula to dist/homebrew/ as a build artifact, but won't try
# to push it. Remove this flag (and ensure HOMEBREW_TAP_GITHUB_TOKEN is set)
# once the tap repository is created.
brews:
  - name: depsilo
    skip_upload: true
    repository:
      owner: depsilo
      name: homebrew-tap
    homepage: "https://depsilo.com"
    description: "Supply-chain enforcement proxy for 14 ecosystems and Docker OCI"
    license: "MIT"
    install: |
      bin.install "depsilo"
    test: |
      system "#{bin}/depsilo", "version"
