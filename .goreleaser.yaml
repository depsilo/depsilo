version: 2

builds:
  - id: depsilo
    main: ./cmd/depsilo
    binary: depsilo
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
      - -buildvcs=false
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X depsilo/internal/version.Version={{.Version}}
      - -X depsilo/internal/version.Commit={{.Commit}}
      - -X depsilo/internal/version.BuildDate={{.Date}}
    hooks:
      post:
        # Windows binary gets .exe extension naturally; on unix, ensure executable bit
        - cmd: chmod +x {{ .Path }}
          env:
            - "{{ if ne .Os \"windows\" }}true{{ end }}"

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - config.example.toml
      - docker-compose.yml
      - README.md
      - LICENSE
    name_template: "depsilo_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: depsilo
    name: depsilo
  prerelease: auto
  draft: true
  use_existing_draft: true
  replace_existing_artifacts: true
  extra_files:
    - glob: ./install.sh
