version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: depsilo
    main: ./cmd/server
    binary: depsilo
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X depsilo/internal/version.Version={{.Version}}
      - -X depsilo/internal/version.Commit={{.Commit}}
      - -X depsilo/internal/version.BuildDate={{.Date}}

archives:
  - id: default
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    files:
      - config.example.toml
    name_template: "depsilo_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: depsilo
    name: depsilo
  prerelease: auto
  draft: false
